name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          }
          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: |
          python -m pip install -r runtime\requirements.txt
          python -m pip install -r runtime\requirements-dev.txt

      - name: Frontend lint
        run: npm run lint

      - name: Frontend test
        run: npm run test

      - name: Runtime lint
        run: cd runtime && python -m ruff check app/ tests/

      - name: Runtime test
        run: cd runtime && python -m pytest tests/ -v --tb=short

      - name: Build Python runtime sidecar
        shell: pwsh
        run: .\scripts\build-runtime-sidecar.ps1

      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Generate update manifest
        shell: pwsh
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          .\scripts\generate-latest-json.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -BundleDir "apps\desktop\src-tauri\target\release\bundle" `
            -OutputPath "apps\desktop\src-tauri\target\release\bundle\latest.json"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AI Interpretation Assistant ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/latest.json
