name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            portaudio19-dev

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: runtime/requirements*.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: |
          python -m pip install -r runtime/requirements.txt
          python -m pip install -r runtime/requirements-dev.txt

      - name: Frontend lint
        run: npm run lint

      - name: Frontend test
        run: npm run test

      - name: Runtime lint
        run: cd runtime && python -m ruff check app/ tests/

      - name: Runtime test
        run: cd runtime && python -m pytest tests/ -v --tb=short

      - name: Build Python runtime sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: npm run runtime:sidecar

      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate update manifest
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/generate-latest-json.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --bundle-dir "release-artifacts" \
            --output-path "release-artifacts/latest.json"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AI Interpretation Assistant ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.exe.sig
            release-artifacts/**/*.msi
            release-artifacts/**/*.msi.sig
            release-artifacts/**/*.dmg
            release-artifacts/**/*.dmg.sig
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.AppImage.sig
            release-artifacts/**/*.deb
            release-artifacts/**/*.deb.sig
            release-artifacts/latest.json
