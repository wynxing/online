name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run desktop:build

      - name: Test
        run: npm run test

  runtime:
    name: Runtime Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: runtime/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install -r runtime/requirements.txt
          python -m pip install -r runtime/requirements-dev.txt

      - name: Lint
        run: cd runtime && python -m ruff check app/ tests/

      - name: Test with coverage
        run: cd runtime && python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
