[project]
name = "ai-interpretation-runtime"
version = "0.1.0"
description = "AI Simultaneous Interpretation Runtime"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.1",
    "pyinstaller>=6.11.1",
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N815"]  # N815: Pydantic models use camelCase for JSON compat

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/devices.py", "app/audio_capture.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
