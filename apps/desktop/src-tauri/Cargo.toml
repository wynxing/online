[package]
name = "ai-interpretation-desktop"
version = "0.4.2"
description = "AI simultaneous interpretation assistant"
authors = ["AI Interpretation Team"]
edition = "2021"

[lib]
name = "ai_interpretation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "0.4.2", features = [] }

[dependencies]
tauri = { version = "0.4.2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2"
serde = { version = "0.4.2"] }
serde_json = "1"

